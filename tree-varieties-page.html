<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Сорти дерев | OldDuck's Garden</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tree-varieties-page.css">
</head>
<body>

  <!-- TOP LINE -->
  <div class="top-line"></div>

  <!-- HEADER -->
  <header class="header">

    <div class="container nav-container">

      <div class="logo">
        <span class="light">OldDuck’s</span>
        <span class="bold">Garden</span>
      </div>

      <nav class="nav">
        <a href="index.html">Головна</a>
        <a href="#">Про нас</a>
        <a href="#">Наші медіа</a>
        <a href="#">Підтримка</a>
      </nav>

      <button class="menu-btn">...</button>

    </div>

  </header>

  <!-- HERO -->
  <section class="hero">

    <div class="overlay"></div>

    <div class="hero-content">

      <div class="hero-topline">

  <span>
    Підбір дерев
  </span>

  <span class="dot-separator"></span>

  <span id="hero-tree-name">
    Яблуня
  </span>

</div>

<h1 id="hero-title">
  Яблуня
</h1>

      <p id="hero-subtitle">
        Знайдіть найкращий сорт саме для вашого саду
      </p>

      <button class="hero-btn">
        Обрати сорт
      </button>

    </div>

  </section>

  <!-- BREADCRUMBS -->
  <section class="breadcrumbs">

    <div class="container breadcrumb-row">

      <span>
        Головна
      </span>

      <span class="arrow">
        ›
      </span>

      <span>
        Підбір дерев
      </span>

      <span class="arrow">
        ›
      </span>

      <span class="active-page" id="breadcrumb-tree">
        Яблуня
      </span>

    </div>

  </section>

  <!-- FILTERS -->
  <section class="filters">

    <div class="container">

      <div class="filter-header">

        <h3>
          Фільтр за метою
        </h3>

        <p>
          Оберіть що важливо для вас
        </p>

      </div>

      <div class="filter-buttons">

        <button class="active" data-filter="all">
          Усі сорти
        </button>

        <button data-filter="winter">
          Зимове зберігання
        </button>

        <button data-filter="early">
          Раннє достигання
        </button>

        <button data-filter="fresh">
          Свіже вживання
        </button>

        <button data-filter="conservation">
          Концервація
        </button>

        <button data-filter="decorative">
          Декоративні
        </button>

      </div>

    </div>

  </section>

  <!-- TREE VARIETIES -->
  <section class="trees">

    <div class="container">

      <h2 id="tree-title">
        Сорти яблуні
      </h2>

      <div class="tree-grid" id="tree-grid">

        <!-- JS inject -->

      </div>

    </div>

  </section>

  <script src="js/tree-varieties-page.js"></script>

</body>
</html>
